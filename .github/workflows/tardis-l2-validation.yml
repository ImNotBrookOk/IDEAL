name: Research — Tardis incremental L2 sample validation

on:
  push:
    branches:
      - research/okx-l2-sample-2026-11-16
    paths:
      - .github/workflows/tardis-l2-validation.yml
      - research/tardis_l2_audit.py
      - research/tests/test_tardis_l2_audit.py

permissions:
  contents: read

concurrency:
  group: tardis-l2-sample-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Tardis public normalized L2 sample
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run Tardis parser tests (red-first checkpoint)
        env:
          PYTHONPATH: research
        run: python -m unittest research/tests/test_tardis_l2_audit.py -v
