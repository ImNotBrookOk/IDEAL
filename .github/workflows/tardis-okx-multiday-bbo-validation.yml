name: Research — Tardis OKX multi-day BBO agreement

on:
  push:
    branches:
      - research/okx-l2-sample-2026-11-16
    paths:
      - research/tardis_l2_audit.py
      - research/okx_archive_audit.py
      - research/compare_bbo_series.py
      - research/tests/**
      - research/requirements.txt

permissions:
  contents: read

concurrency:
  group: tardis-okx-multiday-bbo-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Compare Tardis and official OKX BBO on Sep/Oct 2026
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pinned research JSON parser
        run: python -m pip install --disable-pip-version-check -r research/requirements.txt

      - name: Run complete research unit suite
        env:
          PYTHONPATH: research
        run: python -m unittest discover -s research/tests -v

      - name: Retrieve Sep and Oct first-of-month Tardis and official OKX L2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-output
          for date in 2026-09-01 2026-10-01; do
            year=${date:0:4}
            month=${date:5:2}
            day=${date:8:2}
            tag=${year}${month}${day}
            curl --fail --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 2400 \
              --output "research-output/tardis-okx-${tag}.csv.gz" \
              "https://datasets.tardis.dev/v1/okex-swap/incremental_book_L2/${year}/${month}/${day}/BTC-USDT-SWAP.csv.gz"
            curl --fail --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 2400 \
              --output "research-output/official-okx-${tag}.tar.gz" \
              "https://static.okx.com/cdn/okx/match/orderbook/pro/L2/400lv/daily/${tag}/BTC-USDT-SWAP-L2orderbook-400lv-${year}-${month}-${day}.tar.gz"
          done
          gzip -t research-output/*.csv.gz research-output/*.tar.gz
          for archive in research-output/official-okx-*.tar.gz; do
            tar -tzf "$archive" > "${archive%.tar.gz}-members.txt"
          done
          sha256sum research-output/* > research-output/SHA256SUMS
          {
            echo "Retrieved UTC: $(date -u +%FT%TZ)"
            for file in research-output/*; do
              [ -f "$file" ] && echo "$(basename "$file"): $(wc -c < "$file") bytes"
            done
          } > research-output/manifest.txt

      - name: Reconstruct and compare BBO without look-ahead
        env:
          PYTHONPATH: research
        shell: bash
        run: |
          set -euo pipefail
          for tag in 20260901 20261001; do
            date="${tag:0:4}-${tag:4:2}-${tag:6:2}"
            python research/tardis_l2_audit.py \
              --l2 "research-output/tardis-okx-${tag}.csv.gz" \
              --bbo-output "research-output/tardis-bbo-${tag}.csv" \
              | tee "research-output/tardis-summary-${tag}.json"
            python research/okx_archive_audit.py \
              --bbo-output "research-output/official-bbo-${tag}.csv" \
              "research-output/official-okx-${tag}.tar.gz" \
              | tee "research-output/official-summary-${tag}.json"
            LC_ALL=C sort -s -t, -k1,1n "research-output/tardis-bbo-${tag}.csv" -o "research-output/tardis-bbo-sorted-${tag}.csv"
            LC_ALL=C sort -s -t, -k1,1n "research-output/official-bbo-${tag}.csv" -o "research-output/official-bbo-sorted-${tag}.csv"
            python research/compare_bbo_series.py \
              --tardis-bbo "research-output/tardis-bbo-sorted-${tag}.csv" \
              --official-bbo "research-output/official-bbo-sorted-${tag}.csv" \
              | tee "research-output/bbo-comparison-${tag}.json"
          done

      - name: Remove raw archives and reconstructed BBO rows
        if: always()
        shell: bash
        run: |
          rm -f research-output/*.csv.gz research-output/*.tar.gz
          rm -f research-output/*-bbo-*.csv research-output/*-bbo.csv

      - name: Upload audit summaries only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tardis-okx-multiday-bbo-summary
          path: research-output/
          if-no-files-found: warn
          retention-days: 3
