name: Research — dependency and workflow security audit

on:
  push:
    branches:
      - research/okx-l2-sample-2026-11-16
    paths:
      - .github/workflows/**
      - .github/workflows/research-security-audit.yml
      - research/requirements.txt
      - research/nautilus_poc/requirements.txt

permissions:
  contents: read

concurrency:
  group: research-security-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Audit research dependencies and GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install audit tools
        run: |
          python -m pip install --disable-pip-version-check \
            pip-audit==2.10.1 \
            zizmor==1.32.0 \
            cyclonedx-bom==7.5.0

      - name: Resolve the exact research dependency environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check \
            -r research/nautilus_poc/requirements.txt \
            -r research/requirements.txt
          mkdir -p research-output

      - name: Generate CycloneDX SBOM for resolved research environment
        run: |
          cyclonedx-py environment .venv \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file research-output/research-python-sbom.json

      - name: Run Python vulnerability and GitHub Actions workflow audits
        shell: bash
        run: |
          set +e
          pip-audit --path .venv/lib/python3.12/site-packages \
            --format json \
            --output research-output/pip-audit.json
          pip_status=$?
          zizmor --format json .github/workflows \
            > research-output/zizmor.json
          zizmor_status=$?
          {
            echo "pip_audit_exit_code=$pip_status"
            echo "zizmor_exit_code=$zizmor_status"
            echo "python=$(python --version 2>&1)"
            echo "pip_audit=$(pip-audit --version)"
            echo "zizmor=$(zizmor --version)"
          } > research-output/audit-manifest.txt
          if [ "$pip_status" -ne 0 ] || [ "$zizmor_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload audit reports and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-security-audit
          path: research-output/
          if-no-files-found: warn
          retention-days: 7
