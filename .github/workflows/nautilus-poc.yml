name: NautilusTrader isolated proof of concept
# Deliberately pinned to the exact pre-release under evaluation; CI is research-only.

on:
  push:
    paths:
      - "research/nautilus_poc/**/*.py"
      - "research/nautilus_poc/requirements.lock"
      - ".github/workflows/nautilus-poc.yml"
  pull_request:
    paths:
      - "research/nautilus_poc/**/*.py"
      - "research/nautilus_poc/requirements.lock"
      - ".github/workflows/nautilus-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-poc:
    name: POC (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: research/nautilus_poc/requirements.lock
      - name: Install pinned research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r research/nautilus_poc/requirements.lock
      - name: Verify engine version
        run: |
          python -c "import nautilus_trader; print(nautilus_trader.__version__); assert nautilus_trader.__version__ == '2.0.0rc9'"
      - name: Run isolated proof-of-concept tests
        working-directory: research/nautilus_poc
        run: python -m pytest -q

      - name: Benchmark SQLite event journal (informational)
        working-directory: research/nautilus_poc
        run: python benchmark_event_journal.py --events 5000 --payload-sizes 256 1024
