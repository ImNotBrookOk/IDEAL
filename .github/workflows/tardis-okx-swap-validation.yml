name: Research — Tardis OKX Swap and official archive sample validation

on:
  push:
    branches:
      - research/okx-l2-sample-2026-11-16
    paths:
      - .github/workflows/tardis-okx-swap-validation.yml
      - research/tardis_l2_audit.py
      - research/okx_archive_audit.py
      - research/compare_bbo_series.py
      - research/tests/**

permissions:
  contents: read

concurrency:
  group: tardis-okx-swap-sample-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Tardis OKX Swap and OKX official 400-level archives
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pinned research JSON parser
        run: python -m pip install --disable-pip-version-check orjson==3.11.3

      - name: Run full research unit suite
        env:
          PYTHONPATH: research
        run: python -m unittest discover -s research/tests -v

      - name: Download same-day Tardis OKX Swap and official OKX module-4 archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-output
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 2400 \
            --output research-output/tardis-okex-swap-BTC-USDT-SWAP-L2-2026-11-01.csv.gz \
            "https://datasets.tardis.dev/v1/okex-swap/incremental_book_L2/2026/11/01/BTC-USDT-SWAP.csv.gz"
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 2400 \
            --output research-output/tardis-okex-swap-BTC-USDT-SWAP-trades-2026-11-01.csv.gz \
            "https://datasets.tardis.dev/v1/okex-swap/trades/2026/11/01/BTC-USDT-SWAP.csv.gz"
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 2400 \
            --output research-output/okx-official-BTC-USDT-SWAP-L2-400-2026-11-01.tar.gz \
            "https://static.okx.com/cdn/okx/match/orderbook/pro/L2/400lv/daily/20261101/BTC-USDT-SWAP-L2orderbook-400lv-2026-11-01.tar.gz"
          gzip -t research-output/*.csv.gz
          gzip -t research-output/okx-official-BTC-USDT-SWAP-L2-400-2026-11-01.tar.gz
          tar -tzf research-output/okx-official-BTC-USDT-SWAP-L2-400-2026-11-01.tar.gz > research-output/official-l2-members.txt
          sha256sum research-output/* > research-output/sha256.txt
          gzip -l research-output/*.csv.gz research-output/okx-official-BTC-USDT-SWAP-L2-400-2026-11-01.tar.gz > research-output/gzip-inventory.txt

      - name: Reconstruct both OKX L2 sources and validate Tardis trades
        env:
          PYTHONPATH: research
        run: |
          python research/tardis_l2_audit.py \
            --l2 research-output/tardis-okex-swap-BTC-USDT-SWAP-L2-2026-11-01.csv.gz \
            --bbo-output research-output/tardis-okx-bbo.csv \
            | tee research-output/tardis-okx-l2-summary.json
          python research/okx_archive_audit.py \
            --bbo-output research-output/official-okx-bbo.csv \
            research-output/okx-official-BTC-USDT-SWAP-L2-400-2026-11-01.tar.gz \
            | tee research-output/okx-official-l2-summary.json
          python research/compare_bbo_series.py \
            --tardis-bbo research-output/tardis-okx-bbo.csv \
            --official-bbo research-output/official-okx-bbo.csv \
            | tee research-output/tardis-vs-official-bbo.json
          python - <<'PY'
          import csv, gzip, json
          from pathlib import Path
          path = Path("research-output/tardis-okex-swap-BTC-USDT-SWAP-trades-2026-11-01.csv.gz")
          with gzip.open(path, "rt", encoding="utf-8-sig", newline="") as stream:
              reader = csv.DictReader(stream)
              required = {"exchange", "symbol", "timestamp", "local_timestamp", "id", "side", "price", "amount"}
              missing = required.difference(reader.fieldnames or [])
              assert not missing, f"missing trade columns: {sorted(missing)}"
              rows = 0
              sides = {}
              previous_local = None
              first_local = last_local = None
              for row in reader:
                  rows += 1
                  local = int(row["local_timestamp"])
                  int(row["timestamp"])
                  assert float(row["price"]) > 0 and float(row["amount"]) > 0
                  side = row["side"].lower()
                  assert side in {"buy", "sell", "unknown"}
                  if previous_local is not None:
                      assert local >= previous_local, "trade local_timestamp moved backwards"
                  previous_local = last_local = local
                  first_local = local if first_local is None else first_local
                  sides[side] = sides.get(side, 0) + 1
              assert rows > 0
          summary = {"rows": rows, "side_counts": sides, "first_local_timestamp_us": first_local, "last_local_timestamp_us": last_local}
          Path("research-output/tardis-okx-trades-summary.json").write_text(json.dumps(summary, sort_keys=True))
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Remove raw archives before artifact upload
        if: always()
        shell: bash
        run: |
          rm -f research-output/*.csv.gz research-output/*.tar.gz research-output/*-bbo.csv

      - name: Upload audit summaries only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tardis-okx-swap-and-official-archive-2026-11-01
          path: research-output/
          if-no-files-found: warn
          retention-days: 3
