name: Research — OKX BTC-USDT-SWAP depth and adjacent-day comparison

on:
  push:
    branches:
      - research/okx-l2-sample-2026-11-16
    paths:
      - .github/workflows/okx-l2-400lv-comparison.yml

permissions:
  contents: read

concurrency:
  group: okx-l2-depth-adjacent-comparison
  cancel-in-progress: true

jobs:
  retrieve-and-verify:
    name: Retrieve bounded 400-level and adjacent-day archives
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Retrieve OKX BTC perpetual archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-output/headers research-output/integrity
          files=(
            "BTC-USDT-SWAP-L2-400-2026-11-12.tar.gz|https://static.okx.com/cdn/okx/match/orderbook/pro/L2/400lv/daily/20261112/BTC-USDT-SWAP-L2orderbook-400lv-2026-11-12.tar.gz"
            "BTC-USDT-SWAP-L2-5000-2026-11-11.tar.gz|https://static.okx.com/cdn/okx/match/orderbook/pro/L2/5000lv/daily/20261111/BTC-USDT-SWAP-L2orderbook-5000lv-2026-11-11.tar.gz"
          )
          : > research-output/SHA256SUMS
          for item in "${files[@]}"; do
            name="${item%%|*}"
            url="${item#*|}"
            curl --fail --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 2400 \
              --dump-header "research-output/headers/$name.headers" \
              --output "research-output/$name" "$url"
            wc -c < "research-output/$name" | tr -d ' ' > "research-output/integrity/$name.bytes"
            sha256sum "research-output/$name" >> research-output/SHA256SUMS
            tar -tzf "research-output/$name" > "research-output/integrity/$name.members"
            gzip -t "research-output/$name"
          done
          {
            echo "Retrieval timestamp (UTC): $(date -u +%FT%TZ)"
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo "Archive byte counts:"
            for item in "${files[@]}"; do
              name="${item%%|*}"
              echo "$name: $(cat "research-output/integrity/$name.bytes")"
              echo "Members for $name:"
              cat "research-output/integrity/$name.members"
            done
            echo "SHA-256:"
            cat research-output/SHA256SUMS
          } > research-output/manifest.txt

      - name: Retain exact archives and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: okx-btc-usdt-swap-depth-adjacent-comparison
          path: research-output/
          if-no-files-found: warn
          retention-days: 3
