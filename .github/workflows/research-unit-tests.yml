name: Research — Python unit tests

on:
  push:
    branches:
      - research/okx-l2-sample-2026-11-16
    paths:
      - .github/workflows/research-unit-tests.yml
      - research/**/*.py

permissions:
  contents: read

concurrency:
  group: research-unit-tests
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run complete research unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pinned research JSON parser
        run: python -m pip install --disable-pip-version-check orjson==3.11.3

      - name: Compile research modules
        run: python -m compileall -q research

      - name: Run complete research unit suite
        env:
          PYTHONPATH: research
        run: python -m unittest discover -s research/tests -v
